<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CADP protected site</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(1200px 600px at 80% -10%,#1d3f74,transparent 60%),#0b1020;
  color:#e8eefc;font:16px/1.7 -apple-system,"Segoe UI","Microsoft YaHei",sans-serif}
.box{max-width:640px;padding:36px;border:1px solid #26304a;border-radius:18px;background:rgba(18,26,46,.78)}
h1{margin:0 0 10px;font-size:26px;letter-spacing:-.5px}
.grad{background:linear-gradient(92deg,#9cc3ff,#62e0c3);-webkit-background-clip:text;background-clip:text;color:transparent}
p{color:#9fb0cc}
code{background:#1a2440;padding:2px 7px;border-radius:5px}
</style>
</head>
<body>
<div class="box">
  <h1>CADP <span class="grad">protected site</span></h1>
  <p>这个页面受 CADP（Challenge Anti DDoS +）保护。</p>
  <p>首次访问会要求完成一组轻量计算挑战；通过后 <code>cadp_pass</code> cookie 在有效期内免验证。</p>
  <p>把静态文件放进 <code>site/</code> 即可替换本示例页。</p>
</div>
</body>
</html>
